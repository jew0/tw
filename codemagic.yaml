workflows:
  ios-release:
    name: iOS Release

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Get dependencies
        script: |
          flutter pub get

      - name: Build IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive